name: Materialize preserved BIOS images

on:
  push:
    paths:
      - '.bios-source/READY'
      - '.github/workflows/materialize-bios.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reconstruct and retrieve verified ROM images
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .bios-source/READY ]]; then
            echo 'READY marker absent; nothing to materialize.'
            exit 0
          fi

          mkdir -p bios/original bios/archive bios/qdi-official /tmp/qdi-bios

          # Unique physical dump preserved in this repository as staged base64 chunks.
          # Chunks are numbered with a fixed-width suffix and concatenated in lexical order.
          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = sorted(Path('.bios-source').glob('origchunk.*.b64'))
          if not parts:
              raise SystemExit('No origchunk.*.b64 files found')
          encoded = ''.join(p.read_text(encoding='ascii') for p in parts)
          raw = base64.b64decode(encoded, validate=False)
          out = Path('bios/original/OPTi895P3_GREEN_PC_IVN5.0_1994-12-07.bin')
          out.write_bytes(raw)
          print(f'Reconstructed {out}: {len(raw)} bytes from {len(parts)} chunks')
          PY

          printf '%s  %s\n' \
            7874a75e23389c329917e1b50bfa531a4853829b821e4a6fec46430a06966097 \
            bios/original/OPTi895P3_GREEN_PC_IVN5.0_1994-12-07.bin \
            | sha256sum --check

          extract_matching_file() {
            local downloaded="$1"
            local expected="$2"
            local output="$3"

            if printf '%s  %s\n' "$expected" "$downloaded" | sha256sum --check --status; then
              cp "$downloaded" "$output"
              return 0
            fi

            if unzip -t "$downloaded" >/dev/null 2>&1; then
              while IFS= read -r entry; do
                unzip -p "$downloaded" "$entry" > /tmp/qdi-bios/candidate || continue
                if printf '%s  %s\n' "$expected" /tmp/qdi-bios/candidate | sha256sum --check --status; then
                  cp /tmp/qdi-bios/candidate "$output"
                  return 0
                fi
              done < <(unzip -Z1 "$downloaded")
            fi

            echo "No payload with expected SHA-256 $expected found in $downloaded" >&2
            return 1
          }

          # Existing VOGONS Vintage Driver Library image.
          curl --fail --location --retry 3 \
            'https://vogonsdrivers.com/getfile.php?fileid=1699&menustate=0' \
            --output /tmp/qdi-bios/vogons-download
          extract_matching_file \
            /tmp/qdi-bios/vogons-download \
            d188089f4f069b78027db0d180c046899d38fc29dca38813ad9c935a8c7d6b17 \
            bios/archive/qdi_v4p895p3_smt_v5_bios.bin

          # QDI archive package P895V14.ZIP.
          curl --fail --location --retry 3 \
            'https://ftpmirror.infania.net/sites/ct_treiber_service/treiber/qdi/bios/p895v14.zip' \
            --output /tmp/qdi-bios/p895v14.zip
          extract_matching_file \
            /tmp/qdi-bios/p895v14.zip \
            64349df495153cdb4e88e8f1e042e61322d410c7167a7bd048d159adb22e2281 \
            bios/qdi-official/P895V14.ROM

          sha256sum --check CHECKSUMS.sha256

      - name: Commit ROM images
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bios/qdi-official/P895V14.ROM ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bios/original bios/archive bios/qdi-official
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add preserved BIOS images'
          git push
