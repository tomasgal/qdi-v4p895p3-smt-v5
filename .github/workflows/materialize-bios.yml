name: Materialize preserved BIOS images

on:
  push:
    paths:
      - '.bios-source/**'
      - '.github/workflows/materialize-bios.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified ROM images
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .bios-source/READY ]]; then
            echo 'Waiting for READY marker.'
            exit 0
          fi

          mkdir -p bios/original bios/archive bios/qdi-official

          cat .bios-source/original.part*.b64 \
            | base64 --decode \
            > bios/original/OPTi895P3_GREEN_PC_IVN5.0_1994-12-07.bin

          cat .bios-source/vogons.part*.b64 \
            | base64 --decode \
            > bios/archive/qdi_v4p895p3_smt_v5_bios.bin

          cat .bios-source/p895v14.part*.b64 \
            | base64 --decode \
            > bios/qdi-official/P895V14.ROM

          sha256sum --check CHECKSUMS.sha256

      - name: Commit ROM images
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f bios/qdi-official/P895V14.ROM ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bios/original bios/archive bios/qdi-official
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add preserved BIOS images'
          git push
